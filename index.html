<title>Colorarium — Guia Visual de Cores</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
    --paper:#f5f0e8;
    --paper2:#ebe3d6;
    --ink:#292621;
    --muted:#756f67;
    --line:rgba(50,40,30,.14);
    --white:#fffdf8;
    --shadow:0 15px 45px rgba(50,40,30,.10);
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 15%,rgba(255,255,255,.8),transparent 25%),
        radial-gradient(circle at 85% 80%,rgba(216,202,180,.25),transparent 30%),
        var(--paper);
    color:var(--ink);
    font-family:"DM Sans",sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.22;
    background-image:radial-gradient(rgba(50,40,30,.12) .5px,transparent .5px);
    background-size:6px 6px;
    z-index:10;
}

header{
    padding:55px 7% 35px;
    text-align:center;
    position:relative;
}

.small-title{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:12px;
}

h1{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(52px,8vw,105px);
    line-height:.85;
    font-weight:500;
    letter-spacing:-3px;
}

.subtitle{
    max-width:650px;
    margin:22px auto 0;
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
}

.search-area{
    max-width:760px;
    margin:25px auto 0;
    position:relative;
}

.search{
    width:100%;
    border:1px solid var(--line);
    background:rgba(255,253,248,.8);
    padding:17px 50px 17px 20px;
    border-radius:50px;
    outline:none;
    font-family:inherit;
    font-size:14px;
    box-shadow:var(--shadow);
    transition:.25s;
}

.search:focus{
    border-color:#8b8175;
    transform:translateY(-2px);
}

.search-icon{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    font-size:18px;
}

.categories{
    max-width:1500px;
    margin:20px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
}

.category{
    border:1px solid var(--line);
    background:rgba(255,255,255,.4);
    padding:8px 13px;
    border-radius:30px;
    cursor:pointer;
    font-size:11px;
    transition:.2s;
}

.category:hover,
.category.active{
    background:var(--ink);
    color:white;
}

main{
    width:min(1250px,92%);
    margin:20px auto 100px;
}

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin:55px 0 20px;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
}

.section-heading h2{
    font-family:"Cormorant Garamond",serif;
    font-size:38px;
    font-weight:500;
}

.section-heading span{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.families{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.family-card{
    background:rgba(255,253,248,.75);
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 7px 25px rgba(50,40,30,.05);
}

.family-card:hover{
    transform:translateY(-5px) rotate(.15deg);
    box-shadow:var(--shadow);
}

.family-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.family-name{
    font-family:"Cormorant Garamond",serif;
    font-size:29px;
}

.family-count{
    font-size:10px;
    color:var(--muted);
}

.swatches{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    height:110px;
    border-radius:15px;
    overflow:hidden;
}

.swatch{
    position:relative;
    transition:.25s;
    cursor:pointer;
}

.swatch:hover{
    transform:scaleY(1.08);
    z-index:2;
}

.family-description{
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    margin-top:14px;
}

.detail{
    display:none;
    margin-top:35px;
    animation:appear .45s ease;
}

.detail.show{ display:block; }

@keyframes appear{
    from{ opacity:0; transform:translateY(15px); }
    to{ opacity:1; transform:translateY(0); }
}

.detail-card{
    background:rgba(255,253,248,.9);
    border:1px solid var(--line);
    border-radius:30px;
    padding:30px;
    box-shadow:var(--shadow);
}

.close{
    float:right;
    border:1px solid var(--line);
    background:none;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.detail-main{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:35px;
}

.big-color{
    min-height:260px;
    border-radius:25px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
    position:relative;
}

.color-paper{
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(10px);
    padding:13px;
    border-radius:14px;
}

.color-paper strong{
    display:block;
    font-family:"Cormorant Garamond",serif;
    font-size:25px;
}

.detail-info h2{
    font-family:"Cormorant Garamond",serif;
    font-size:50px;
    font-weight:500;
}

.family-label{
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:10px;
}

.description{
    color:var(--muted);
    line-height:1.8;
    margin:15px 0;
    max-width:650px;
}

.codes{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.code{
    padding:9px 12px;
    background:var(--paper2);
    border-radius:8px;
    font-family:monospace;
    font-size:12px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
}

.info-box{
    border:1px solid var(--line);
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.35);
}

.info-box h3{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:9px;
}

.info-box p{
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
}

.tones-title{
    margin-top:35px;
    font-family:"Cormorant Garamond",serif;
    font-size:34px;
}

.tone-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(125px,1fr));
    gap:12px;
    margin-top:15px;
}

.tone{
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
    background:var(--white);
    cursor:pointer;
    transition:.2s;
}

.tone:hover{ transform:translateY(-3px); }

.tone-color{ height:90px; }

.tone-info{ padding:10px; }

.tone-info strong{
    display:block;
    font-size:12px;
    margin-bottom:4px;
}

.tone-info small{
    color:var(--muted);
    font-family:monospace;
}

.palette{
    display:flex;
    height:90px;
    border-radius:18px;
    overflow:hidden;
    margin-top:15px;
}

.palette div{
    flex:1;
    cursor:pointer;
    transition:.2s;
}

.palette div:hover{ flex:1.4; }

.search-results{
    display:none;
    margin-top:25px;
}

.search-results.show{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:14px;
}

.result{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:17px;
    overflow:hidden;
    cursor:pointer;
}

.result-color{ height:100px; }

.result-info{ padding:12px; }

.result-info strong{
    font-size:13px;
    display:block;
}

.result-info small{ color:var(--muted); }

footer{
    border-top:1px solid var(--line);
    text-align:center;
    padding:35px 20px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:1px;
}

@media(max-width:750px){
    header{ padding-top:35px; }
    h1{ font-size:62px; }
    .detail-main{ grid-template-columns:1fr; }
    .big-color{ min-height:210px; }
    .info-grid{ grid-template-columns:1fr; }
    .section-heading{
        align-items:start;
        gap:10px;
        flex-direction:column;
    }
    .swatches{ height:80px; }
}
</style>

/* ==========================================================
   ELEMENTOS
========================================================== */

const familiesEl = document.getElementById("families");
const categoriesEl = document.getElementById("categories");
const detailEl = document.getElementById("detail");
const resultsEl = document.getElementById("results");
const searchEl = document.getElementById("search");

const allColors = [];

Object.entries(palettes).forEach(([family,data]) => {
    data.colors.forEach(color => {
        allColors.push({
            name:color[0],
            hex:color[1],
            family:family
        });
    });
});

/* ==========================================================
   CATEGORIAS
========================================================== */

categoriesEl.innerHTML =
    `<button class="category active" onclick="showAll()">Todas</button>` +
    Object.keys(palettes)
    .map(name =>
        `<button class="category" onclick="filterFamily('${name}')">${name}</button>`
    )
    .join("");

/* ==========================================================
   DESENHAR FAMÍLIAS
========================================================== */

function renderFamilies(){
    familiesEl.innerHTML = "";

    Object.entries(palettes).forEach(([family,data]) => {
        const card = document.createElement("article");
        card.className = "family-card";
        card.onclick = () => openFamily(family);

        card.innerHTML = `
            <div class="family-top">
                <div class="family-name">${family}</div>
                <div class="family-count">${data.colors.length} tons</div>
            </div>

            <div class="swatches">
                ${data.colors.slice(0,7).map(c => `
                    <div class="swatch" style="background:${c[1]}" title="${c[0]}"></div>
                `).join("")}
            </div>

            <p class="family-description">${data.description}</p>
        `;

        familiesEl.appendChild(card);
    });
}

renderFamilies();

/* ==========================================================
   ABRIR FAMÍLIA
========================================================== */

function openFamily(family){
    const data = palettes[family];
    const first = data.colors[Math.floor(data.colors.length/2)];
    openColor(first[0], first[1], family, data);
}

/* ==========================================================
   ABRIR COR
========================================================== */

function openColor(name,hex,family,data){

    const rgb = hexToRgb(hex);
    const hsl = hexToHsl(hex);
    const opposite = getComplementary(hex);

    detailEl.classList.add("show");

    detailEl.innerHTML = `
        <div class="detail-card">
            <button class="close" onclick="closeDetail()">×</button>

            <div class="detail-main">
                <div class="big-color" style="background:${hex}">
                    <div class="color-paper">
                        <strong>${name}</strong>
                        <span>${hex}</span>
                    </div>
                </div>

                <div class="detail-info">
                    <div class="family-label">${family}</div>
                    <h2>${name}</h2>
                    <p class="description">${data.description}</p>

                    <div class="codes">
                        <div class="code">HEX ${hex}</div>
                        <div class="code">RGB ${rgb}</div>
                        <div class="code">HSL ${hsl}</div>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-box">
                    <h3>Significado</h3>
                    <p>${data.meaning}</p>
                </div>

                <div class="info-box">
                    <h3>Onde usar</h3>
                    <p>${data.use}</p>
                </div>

                <div class="info-box">
                    <h3>Combina com</h3>
                    <p>${data.combinations.join(", ")}</p>
                </div>
            </div>

            <h3 class="tones-title">Tons de ${family.toLowerCase()}</h3>

            <div class="tone-grid">
                ${data.colors.map(c => `
                    <div class="tone"
                         onclick="openColor(
                            '${c[0]}',
                            '${c[1]}',
                            '${family}',
                            palettes['${family}']
                         )">
                        <div class="tone-color" style="background:${c[1]}"></div>
                        <div class="tone-info">
                            <strong>${c[0]}</strong>
                            <small>${c[1]}</small>
                        </div>
                    </div>
                `).join("")}
            </div>

            <h3 class="tones-title">Cor oposta / complementar</h3>

            <div class="tone" style="max-width:220px;margin-top:15px"
                 onclick="showComplementary('${opposite}')">
                <div class="tone-color" style="background:${opposite}"></div>
                <div class="tone-info">
                    <strong>Complementar</strong>
                    <small>${opposite}</small>
                </div>
            </div>

            <h3 class="tones-title">Paleta sugerida</h3>
            <div class="palette">
                ${createPalette(hex,data.colors)}
            </div>
        </div>
    `;

    detailEl.scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ==========================================================
   PALETA
========================================================== */

function createPalette(main,colors){
    const picks = [
        main,
        colors[0][1],
        colors[Math.floor(colors.length/3)][1],
        colors[Math.floor(colors.length/1.5)][1],
        colors[colors.length-1][1]
    ];

    return picks.map(color => `
        <div style="background:${color}" title="${color}"
             onclick="copyColor('${color}')"></div>
    `).join("");
}

/* ==========================================================
   COMPLEMENTAR
========================================================== */

function getComplementary(hex){
    const rgb = hexToRgbValues(hex);
    return "#" + rgb.map(v =>
        (255-v).toString(16).padStart(2,"0")
    ).join("").toUpperCase();
}

function showComplementary(hex){
    const found = allColors.find(c =>
        c.hex.toUpperCase() === hex.toUpperCase()
    );

    if(found){
        openColor(found.name, found.hex, found.family, palettes[found.family]);
    } else {
        copyColor(hex);
    }
}

/* ==========================================================
   CONVERSÕES
========================================================== */

function hexToRgbValues(hex){
    hex = hex.replace("#","");
    return [
        parseInt(hex.substring(0,2),16),
        parseInt(hex.substring(2,4),16),
        parseInt(hex.substring(4,6),16)
    ];
}

function hexToRgb(hex){
    return hexToRgbValues(hex).join(", ");
}

function hexToHsl(hex){
    let [r,g,b] = hexToRgbValues(hex).map(v => v/255);

    const max = Math.max(r,g,b);
    const min = Math.min(r,g,b);
    let h = 0, s = 0;
    const l = (max+min)/2;

    if(max !== min){
        const d = max-min;
        s = l > .5 ? d/(2-max-min) : d/(max+min);

        switch(max){
            case r: h = (g-b)/d + (g<b ? 6 : 0); break;
            case g: h = (b-r)/d + 2; break;
            case b: h = (r-g)/d + 4; break;
        }
        h /= 6;
    }

    return `${Math.round(h*360)}°, ${Math.round(s*100)}%, ${Math.round(l*100)}%`;
}

/* ==========================================================
   PESQUISA
========================================================== */

searchEl.addEventListener("input",searchColors);

function searchColors(){
    const query = searchEl.value.toLowerCase().trim();

    if(!query){
        resultsEl.classList.remove("show");
        familiesEl.style.display = "grid";
        return;
    }

    familiesEl.style.display = "none";
    resultsEl.classList.add("show");

    const results = allColors.filter(color =>
        color.name.toLowerCase().includes(query) ||
        color.hex.toLowerCase().includes(query) ||
        color.family.toLowerCase().includes(query)
    );

    if(!results.length){
        resultsEl.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:50px;color:#756f67">
                Nenhuma cor encontrada.
            </div>
        `;
        return;
    }

    resultsEl.innerHTML = results.map(color => `
        <div class="result"
             onclick="openColor(
                '${color.name}',
                '${color.hex}',
                '${color.family}',
                palettes['${color.family}']
             )">
            <div class="result-color" style="background:${color.hex}"></div>
            <div class="result-info">
                <strong>${color.name}</strong>
                <small>${color.hex} · ${color.family}</small>
            </div>
        </div>
    `).join("");
}

/* ==========================================================
   FILTRO POR FAMÍLIA
========================================================== */

function filterFamily(family){
    searchEl.value = "";
    familiesEl.style.display = "grid";
    resultsEl.classList.remove("show");

    document.querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    const button = [...document.querySelectorAll(".category")]
        .find(btn => btn.textContent === family);

    if(button) button.classList.add("active");

    familiesEl.innerHTML = "";
    const data = palettes[family];

    const card = document.createElement("article");
    card.className = "family-card";

    card.innerHTML = `
        <div class="family-top">
            <div class="family-name">${family}</div>
            <div class="family-count">${data.colors.length} tons</div>
        </div>

        <div class="swatches">
            ${data.colors.slice(0,7).map(c => `
                <div class="swatch" style="background:${c[1]}"
                     onclick="event.stopPropagation();
                              openColor(
                                 '${c[0]}',
                                 '${c[1]}',
                                 '${family}',
                                 palettes['${family}']
                              )"></div>
            `).join("")}
        </div>

        <p class="family-description">${data.description}</p>

        <div class="tone-grid" style="margin-top:18px">
            ${data.colors.map(c => `
                <div class="tone" onclick="event.stopPropagation();
                     openColor('${c[0]}','${c[1]}','${family}',palettes['${family}'])">
                    <div class="tone-color" style="background:${c[1]}"></div>
                    <div class="tone-info">
                        <strong>${c[0]}</strong>
                        <small>${c[1]}</small>
                    </div>
                </div>
            `).join("")}
        </div>
    `;

    familiesEl.appendChild(card);
}

function showAll(){
    searchEl.value = "";
    document.querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    document.querySelector(".category").classList.add("active");
    resultsEl.classList.remove("show");
    familiesEl.style.display = "grid";
    renderFamilies();
}

/* ==========================================================
   FECHAR / COPIAR
========================================================== */

function closeDetail(){
    detailEl.classList.remove("show");
}

function copyColor(hex){
    navigator.clipboard.writeText(hex);
    const aviso = document.createElement("div");
    aviso.textContent = "Copiado: " + hex;
    aviso.style.cssText = `
        position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
        background:#292621;color:#fff;padding:10px 18px;border-radius:30px;
        font-size:12px;z-index:99;opacity:0;transition:.3s;
    `;
    document.body.appendChild(aviso);
    requestAnimationFrame(() => aviso.style.opacity = "1");
    setTimeout(() => {
        aviso.style.opacity = "0";
        setTimeout(() => aviso.remove(), 300);
    }, 1200);
}

</script>
